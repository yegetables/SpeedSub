name = "speedsub"
main = "sublink-worker.js"
compatibility_date = "2025-09-07"

# 说明：未绑定 KV 时全功能可用（手动模式）。
# 启用配置档（可选）：取消下面注释并填入你自己的 KV namespace id。
# ⚠️ id 属于私有信息，不要提交到公开仓库（本地部署可用 wrangler.prod.toml，
#    或在 Cloudflare 后台直接添加绑定，变量名必须为 SpeedSub_KV）。
# [[kv_namespaces]]
# binding = "SpeedSub_KV"
# id = "your-kv-namespace-id"
